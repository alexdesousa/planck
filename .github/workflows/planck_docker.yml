name: planck_docker Checks

on:
  push:
    branches: [main]
    paths:
      - "planck_docker/**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "planck_docker/**"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sidecar:
    runs-on: ubuntu-latest
    name: "Sidecar OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}"
    defaults:
      run:
        working-directory: planck_docker/sidecar
    strategy:
      matrix:
        otp: ["29.1"]
        elixir: ["1.20.4"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5
        name: Checkout repository
      - uses: erlef/setup-beam@v1
        name: Setup Elixir
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: "26"
      - name: Setup (deps.get + npm install --prefix assets)
        run: mix do local.rebar --force + local.hex --force + setup
      - name: Compile dependencies
        run: mix deps.compile
      - name: Check formatting
        run: mix format --dry-run --check-formatted
      - name: Compile project
        run: mix compile --warnings-as-errors
      - name: Run Credo
        run: mix credo
      - name: Run tests
        run: mix test --exclude integration

  dialyzer:
    runs-on: ubuntu-latest
    name: "Sidecar Dialyzer OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}"
    defaults:
      run:
        working-directory: planck_docker/sidecar
    strategy:
      matrix:
        otp: ["29.1"]
        elixir: ["1.20.4"]
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5
        name: Checkout repository
      - uses: erlef/setup-beam@v1
        name: Setup Elixir
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@v4
        name: Retrieve cached PLT
        id: plt-cache
        with:
          path: planck_docker/sidecar/priv/plts
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-sidecar-plts-${{ hashFiles('planck_docker/sidecar/mix.lock') }}
      - name: Get dependencies
        run: mix do local.rebar --force + local.hex --force + deps.get
      - name: Compile dependencies
        run: mix deps.compile
      - name: Run Dialyzer
        run: mix dialyzer

  # ── Docker image builds (tag pushes only) ─────────────────────────────────
  # Each platform builds natively on its own runner — no QEMU. erlexec's C
  # build shells out to bare `erl` to detect the system architecture, and
  # `erl` reliably crashes on boot under QEMU cross-arch emulation (a known,
  # still-open upstream issue: erlang/otp#10355 — prim_tty's NIF-based
  # terminal handling doesn't work under emulation, on any OTP version).
  # Building natively per-arch and merging the resulting digests into one
  # multi-arch manifest sidesteps the bug entirely instead of working around
  # it inside the Makefile.

  docker-planck-build:
    name: "Build planck image (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    needs: [sidecar, dialyzer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: planck_docker/planck/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/alexdesousa/planck,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-planck-merge:
    name: Merge & push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [docker-planck-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/alexdesousa/planck:${{ steps.version.outputs.version }} \
            $(printf 'ghcr.io/alexdesousa/planck@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/alexdesousa/planck:${{ steps.version.outputs.version }}


