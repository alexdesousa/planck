services:

  # ── First-run workspace setup ──────────────────────────────────────────────
  # Renders config templates and copies the sidecar before any other service
  # starts. Runs to completion and exits; other services depend on it.
  setup:
    build:
      context: ..
      dockerfile: planck_docker/planck/Dockerfile
    image: ghcr.io/alexdesousa/planck:0.1.10
    entrypoint: ["/setup.sh"]
    volumes:
      - ${PLANCK_HOME}/workspace:/workspace
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}

  # ── Planck web UI + agent runtime + sidecar ────────────────────────────────
  planck:
    build:
      context: ..
      dockerfile: planck_docker/planck/Dockerfile
    image: ghcr.io/alexdesousa/planck:0.1.10
    hostname: planck
    ports:
      - "${PLANCK_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    volumes:
      - ${PLANCK_HOME}/workspace:/workspace
      - vault-data:/vault-data:ro
    environment:
      WORKSPACE_DIR: /workspace
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_COLLECTION: ${TYPESENSE_COLLECTION:-workspace}
      SEARXNG_URL: http://searxng:8080
      TIKA_URL: http://tika:9998
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}
      PLANCK_TOOL_PROXY: http://vault:14322
      PLANCK_TOOL_PROXY_CA_CERT: /vault-data/ca/ca.crt.pem
      PLANCK_SECRETS_HOOK: Sidecar.Secrets.AgentVault
      AGENT_VAULT_URL: http://vault:14321
      AGENT_VAULT_EMAIL: ${AGENT_VAULT_EMAIL}
      AGENT_VAULT_PASSWORD: ${AGENT_VAULT_PASSWORD}
    depends_on:
      setup:
        condition: service_completed_successfully
      typesense:
        condition: service_started
      searxng:
        condition: service_started
      tika:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

  # ── Privacy-respecting web search ──────────────────────────────────────────
  searxng:
    image: searxng/searxng:2026.5.17-d7e8b7cd1
    volumes:
      - ${PLANCK_HOME}/workspace/.planck/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Workspace file indexing ────────────────────────────────────────────────
  typesense:
    image: typesense/typesense:29.1
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    volumes:
      - ${PLANCK_HOME}/typesense-data:/data
    command: --data-dir /data --api-key ${TYPESENSE_API_KEY} --enable-cors
    restart: unless-stopped

  # ── Document text extraction (PDF, DOCX, XLSX, …) ─────────────────────────
  tika:
    image: apache/tika:3.3.0.0-full
    restart: unless-stopped

  # ── Credential vault — MITM proxy for outbound LLM and tool HTTP calls ─────
  # Port 14321 (management UI) is intentionally NOT published — all credential
  # management happens through Planck's own secrets modal.
  vault:
    image: infisical/agent-vault:latest
    restart: unless-stopped
    volumes:
      - vault-data:/root/.agent-vault
    environment:
      AGENT_VAULT_MASTER_PASSWORD: ${AGENT_VAULT_MASTER_PASSWORD}

volumes:
  vault-data:
