services:

  # ── First-run workspace setup ──────────────────────────────────────────────
  # Renders config templates, copies the sidecar, and bootstraps agent-vault
  # (registers owner account, creates vault + scoped agent token). Runs to
  # completion and exits; other services depend on it.
  setup:
    build:
      context: ..
      dockerfile: planck_docker/planck/Dockerfile
    image: ghcr.io/alexdesousa/planck:0.2.0
    entrypoint: ["/setup.sh"]
    volumes:
      - ${PLANCK_HOME}/workspace:/workspace
      - ${PLANCK_HOME}:/planck-home
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}
      AGENT_VAULT_URL: http://vault:14321
      AGENT_VAULT_EMAIL: ${AGENT_VAULT_EMAIL}
      AGENT_VAULT_PASSWORD: ${AGENT_VAULT_PASSWORD}
    depends_on:
      vault:
        condition: service_started

  # ── Planck web UI + agent runtime + sidecar ────────────────────────────────
  planck:
    build:
      context: ..
      dockerfile: planck_docker/planck/Dockerfile
    image: ghcr.io/alexdesousa/planck:0.2.0
    hostname: planck
    ports:
      - "${PLANCK_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    volumes:
      - ${PLANCK_HOME}/workspace:/workspace
      - ${PLANCK_HOME}/vault-data:/vault-data:ro
    environment:
      WORKSPACE_DIR: /workspace
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_COLLECTION: ${TYPESENSE_COLLECTION:-workspace}
      SEARXNG_URL: http://searxng:8080
      TIKA_URL: http://tika:9998
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}
      PLANCK_TOOL_PROXY: http://vault:14322
      PLANCK_TOOL_PROXY_CA_CERT: /vault-data/ca/ca.crt.pem
      PLANCK_SECRETS_HOOK: ${PLANCK_SECRETS_HOOK}
      AGENT_VAULT_URL: http://vault:14321
      AGENT_VAULT_TOKEN: ${AGENT_VAULT_TOKEN}
      BEADS_URL: http://beads:8377
      BEADS_TOKEN: ${BEADS_TOKEN}
    depends_on:
      setup:
        condition: service_completed_successfully
      typesense:
        condition: service_started
      searxng:
        condition: service_started
      tika:
        condition: service_started
      vault:
        condition: service_started
      beads:
        condition: service_started
    restart: unless-stopped

  # ── Privacy-respecting web search ──────────────────────────────────────────
  searxng:
    image: searxng/searxng:2026.5.17-d7e8b7cd1
    volumes:
      - ${PLANCK_HOME}/workspace/.planck/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-en}
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Workspace file indexing ────────────────────────────────────────────────
  typesense:
    image: typesense/typesense:29.1
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    volumes:
      - ${PLANCK_HOME}/typesense-data:/data
    command: --data-dir /data --api-key ${TYPESENSE_API_KEY} --enable-cors
    restart: unless-stopped

  # ── Document text extraction (PDF, DOCX, XLSX, …) ─────────────────────────
  tika:
    image: apache/tika:3.3.0.0-full
    restart: unless-stopped

  # ── Credential vault — MITM proxy for outbound LLM and tool HTTP calls ─────
  # Port 14321 (management API) is intentionally NOT published — all credential
  # management happens through Planck's own secrets modal.
  vault:
    image: infisical/agent-vault:latest
    restart: unless-stopped
    volumes:
      - ${PLANCK_HOME}/vault-data:/root/.agent-vault
    environment:
      AGENT_VAULT_MASTER_PASSWORD: ${AGENT_VAULT_MASTER_PASSWORD}

  # ── Dolt SQL server — backing store for the shared beads task board ────────
  # Pinned below 2.3.0: that release (and 2.3.1) regressed DOLT_RESET('--hard'),
  # and nothing in the 2.3.2–2.3.5 release notes indicates a fix.
  dolt:
    build:
      context: ..
      dockerfile: planck_docker/dolt/Dockerfile
    volumes:
      - ${PLANCK_HOME}/dolt-data:/var/lib/dolt
    healthcheck:
      # No mysql client and no HTTP health endpoint ship in the base image
      # (verified against dolthub/dolt's own published Dockerfile — just
      # dolt/curl/tini) — a raw TCP connect via bash's /dev/tcp is the only
      # thing available that confirms sql-server has actually started and
      # is listening. NOT a check that a remote client can authenticate —
      # entrypoint.sh's root@'%' grant runs after the port opens, so a
      # request landing in that narrow window can still see the same
      # "Access denied" this was written to fix; it's expected to be
      # rare and self-heal via beads' own restart, not fully closed here.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306'"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # ── Beads — shared task board API, fronting the dolt server above ──────────
  beads:
    build:
      context: ..
      dockerfile: planck_docker/beads/Dockerfile
    volumes:
      - ${PLANCK_HOME}/beads-data:/data/.beads
    environment:
      BEADS_TOKEN: ${BEADS_TOKEN}
    depends_on:
      dolt:
        condition: service_healthy   # bd init --server would otherwise race dolt's own boot
    restart: unless-stopped
