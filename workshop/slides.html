:root {
  --bg: #f5f5f5;
  --fg: #1a1a1a;
  --card: #ffffff;
  --primary: #5F4FE6;
  --accent: #FED13B;
  --border: #1a1a1a;
  --shadow: #1a1a1a;
  --muted: #CFCCEA;
  --muted-fg: #5B5686;
}

section {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Mono', monospace;
  font-size: 1.05rem;
  padding: 2.5rem 3rem;
  line-height: 1.8;
}

/* Pagination */
section::after {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted-fg);
}

/* ── Headings ── */
h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 1.35rem;
  line-height: 1.6;
  color: var(--fg);
  margin-bottom: 1.5rem;
  letter-spacing: -0.02em;
}

h2 {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.9rem;
  color: var(--primary);
  margin-bottom: 1rem;
  line-height: 1.6;
}

h3 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 1rem;
  color: var(--fg);
  margin-bottom: 0.5rem;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0.25rem;
}

/* ── Lists ── */
ul, ol {
  padding-left: 1.5rem;
  line-height: 2;
}

li::marker {
  color: var(--primary);
  font-weight: 700;
}

/* ── Blockquote ── */
blockquote {
  background: var(--card);
  border: 2px solid var(--border);
  box-shadow: 4px 4px 0 var(--shadow);
  padding: 1rem 1.5rem;
  margin: 1.5rem 0;
  font-style: italic;
  color: var(--fg);
  border-radius: 0;
}

blockquote p {
  margin: 0;
}

/* ── Code ── */
code {
  background: var(--muted);
  color: var(--primary);
  font-family: 'Space Mono', monospace;
  font-size: 0.85em;
  padding: 0.1em 0.4em;
  border: 1px solid var(--border);
  border-radius: 0;
}

pre {
  background: var(--card);
  border: 2px solid var(--border);
  box-shadow: 4px 4px 0 var(--shadow);
  padding: 1rem 1.5rem;
  border-radius: 0;
  font-size: 0.8rem;
  line-height: 1.6;
}

pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--fg);
  font-size: 1em;
}

/* ── Prompt box ── */
.prompt-box {
  border: 2px solid var(--border);
  box-shadow: 4px 4px 0 var(--shadow);
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  overflow: hidden;
  margin: 0.5rem 0;
}
.prompt-box strong { background: none; padding: 0; }
.hl-line {
  display: block;
  padding: 0.5rem 0.75rem;
  border-left: 4px solid;
  margin-bottom: 1px;
  line-height: 1.6;

<h1 id="level-3-the-truth-about-prompts">LEVEL 3: The truth about prompts</h1>
<p>Here's what the &quot;prompt engineers&quot; actually figured out:</p>
<blockquote>
<p>There is no magic. Prompts that work are just <strong>good briefs</strong>.</p>
</blockquote>
<p>Clear task. Relevant context. Specific role. Defined boundaries.</p>
<p>The people getting great results weren't casting spells — they were communicating precisely. The same way you'd brief a skilled colleague before handing off important work.</p>

<p>Think of it as <strong>a meeting room with two things in it</strong>.</p>
<div class="columns">
<div>
<h3 id="the-whiteboard">The whiteboard</h3>
<p>What you bring to the meeting — documents, references, history, instructions. Whatever is on it, the specialist can use. Whatever isn't — doesn't exist.</p>

<div>
<h3 id="the-job-description">The job description</h3>
<p>Who they are in this room — their role, their style, their boundaries. A writer doesn't plan. An editor doesn't rewrite. This keeps specialists from stepping on each other.</p>

<p><strong>Both together make a complete brief.</strong></p>

<h1 id="what-falls-off--and-what-doesnt">What falls off — and what doesn't</h1>
<p>Not everything degrades equally.</p>
<ul>
<li><strong>Before the conversation</strong> — your brief (role, task, information, examples) — is always pinned. The specialist always knows who they are and what they're doing.</li>
<li><strong>During the conversation</strong> — the back-and-forth, the feedback, the decisions made three hours ago — is what falls off.</li>
</ul>
<p>The F in BRIEF (Feedback) happens in the conversation. Everything else belongs in the brief — written once, always there.</p>
<blockquote>
<p>Put the important things in the brief, not the chat. <strong>What you include matters as much as what you ask.</strong></p>
</blockquote>
